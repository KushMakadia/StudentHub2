                🌙
            </button>
        </div>
    </header>

    <main class="main-content">

        <section class="form-card">

            <h1>Create Your Account</h1>

            <form action="register_process.php" method="POST">
                <input type="text" name="name" required placeholder="Full Name">
                <input type="email" name="email" required placeholder="Email">
                <input type="text" name="mobile" required placeholder="Mobile">
                <input type="password" name="password" required placeholder="Password">
                <input type="text" name="course" required placeholder="Course (e.g. CE)">
                <input type="number" name="year" required placeholder="Year (e.g. 2)">

                <select name="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <!-- Optional role selector; defaults to 'student' if omitted -->
                <select name="role">
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                </select>

                <button type="submit">Register</button>
            </form>

        </section>

    </main>
