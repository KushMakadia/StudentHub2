    <main class="main-content">

        <section class="form-card">

            <h1>Create Your Account</h1>

            <form action="C:\xampp\htdocs\PHP_Practical\StudentHub_Registration.php" class="register-form" method="POST">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter Full Name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter Email" required>
                </div>

                <div class="form-group">
                    <label for="usernm">Username</label>
                    <input type="text" id="usernm" name="usernm" placeholder="Choose Username" required>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="course">
                        <option>B.Tech</option>
                        <option>BCA</option>
                        <option>BBA</option>
                        <option>MCA</option>
                        <option>MBA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pwd">Password</label>
                    <input type="password" id="pwd" name="pwd" placeholder="Create Password" required>
                </div>

                <div class="form-group">
                    <label for="cpwd">Confirm Password</label>
                    <input type="password" id="cpwd" name="cpwd" placeholder="Confirm Password" required>
                </div>

                <button type="submit" class="btn">
                    Register
                </button>

            </form>

        </section>
