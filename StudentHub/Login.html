    <header class="site-header">
        <div class="header-container">
            <div class="logo-section">
                <img src="logo.png" alt="StudentHub Logo" class="logo">
                <h2 class="site-title">StudentHub</h2>

                <button class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false">

            </div>
            <nav class="navbar">
                <a href="index.html">Home</a>

                🌙
            </button>
        </div>
    </header>


    <main class="main-content">

        <section class="form-card">

            <h1>Login to StudentHub</h1>

            <form action="login_process.php" method="POST" class="login-form">

                <!-- Display errors dynamically if any occur -->
                <script>
                    const urlParams = new URLSearchParams(window.location.search);
                    if(urlParams.has('error')) {
                        document.write('<p style="color: red; text-align: center; font-weight: bold; margin-bottom: 15px;">' + urlParams.get('error') + '</p>');
                    }
                </script>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <!-- Universal placeholder for everyone -->
                    <input type="email" id="email" name="email" placeholder="Enter your Registered Email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password" required>
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

            </form> 

        </section>

    </main>

    <footer class="site-footer">
