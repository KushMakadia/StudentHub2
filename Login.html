<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="header-container">
            <div class="logo-section">
                <img src="logo.png" alt="StudentHub Logo" class="logo">
                <h2 class="site-title">StudentHub</h2>
            
        <button class="menu-toggle"
                aria-label="Open navigation menu"
                aria-expanded="false">
            ☰
        </button>

            </div>
            <nav class="navbar">
                <a href="index.html" class="active">Home</a>
                <a href="Register.html">Register</a>
                <a href="Login.html">Login</a>
                <a href="Profile.html">Profile</a>
                <a href="Dashboard.html">Dashboard</a>
                <a href="FAQ.html">FAQs</a>
                <a href="Events.html">Events</a>
                <a href="Contact_Us.html">Contact Us</a>
                <a href="About_Us.html">About Us</a>
                <a href="Admin.html">Admin</a>
            </nav>

       <button id="theme-toggle"
                class="theme-btn"
                aria-label="Toggle light and dark theme">
            🌙
        </button>
        </div>
    </header>


    <main class="main-content">

        <section class="form-card">

            <h1>Login to StudentHub</h1>

            <form action="#" class="login-form">

                <div class="form-group">
                    <label for="usernm">Username</label>
                    <input type="text" id="usernm" name="usernm" placeholder="Enter Username" required>
                </div>

                <div class="form-group">
                    <label for="pwd">Password</label>
                    <input type="password" id="pwd" name="pwd" placeholder="Enter Password" required>
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 StudentHub CHARUSAT |
            <a href="Contact_Us.html">Contact Us</a>
        </p>
    </footer>

</body>
</html>
